# winget manifest (installer). Submit to microsoft/winget-pkgs as
# manifests/p/Profullstack/TronBrowser/<version>/.
#
# NOT SUBMITTABLE YET, and the blocker is the artifact rather than the manifest.
# tronbrowser-win-x64.zip contains no tronbrowser.exe: the Windows entry point is
# tronbrowser.cmd, a shim that searches for Python 3.9+ and then drives a copy of
# Ungoogled Chromium the user has to install separately. A winget portable
# package shimming that would install for someone and then fail to start, so it
# would be rejected on review or, worse, accepted and broken.
#
# RelativeFilePath below named tronbrowser.exe, which has never existed in the
# zip; corrected to the file that does. Submitting still needs a real Windows
# build — a self-contained .exe/.msi, or a zip whose entry point runs without
# the user installing an interpreter and a browser first. PairUX ships a nullsoft
# .exe and is in winget-pkgs today, which is the shape to copy.
PackageIdentifier: Profullstack.TronBrowser
PackageVersion: 3.16.0
InstallerType: zip
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/profullstack/tronbrowser.dev/releases/download/v3.16.0/tronbrowser-win-x64.zip
    InstallerSha256: E4F1342048769D1A051635CCB604F617FB6EFE19FFE2C710F1395FF51DE4CC98
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: tronbrowser\tronbrowser.cmd
        PortableCommandAlias: tron
ManifestType: installer
ManifestVersion: 1.6.0
